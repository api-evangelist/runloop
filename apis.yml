aid: runloop
url: https://raw.githubusercontent.com/api-evangelist/runloop/refs/heads/main/apis.yml
name: Runloop
kind: company
description: Runloop provides AI-native cloud development environments (devboxes) and
  an agent benchmarking platform. The Runloop API lets you programmatically spin up
  isolated Linux devboxes, run and stream commands, mount code, snapshot state via
  blueprints and snapshots, and evaluate coding agents against scenarios and
  benchmarks - all over a Bearer-authenticated REST interface at api.runloop.ai/v1.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: true
  try_now: true
  public: false
  label: Freemium (free trial) · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/runloop.png
tags:
- AI
- Developer Environments
- Devboxes
- Coding Agents
- Benchmarking
- Cloud IDE
