  - url: collections/runloop.postman_collection.json
    type: PostmanCollection
  - url: collections/runloop.opencollection.json
    type: OpenCollection
  description: Define reproducible coding-agent tasks with a starting environment,
    input context and scoring contract; start scenario runs, then score and
    complete them to measure agent performance.
- aid: runloop:runloop-benchmarks-api
