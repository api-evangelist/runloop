description: >-
  FinOps view of Runloop spend. Runloop layers a monthly plan (Basic $0 / Pro
  $250 / Enterprise custom) over usage-based compute and storage billed with no
  minimums. The dominant cost is running devbox compute, metered at $0.108 per
  CPU-hour plus $0.0252 per GB-of-memory-hour; suspended devboxes accrue $0
  compute. Blueprint builds bill at $0.108 per CPU-hour. Devbox disk is $0.00034236
  per GB-hour and blueprint / snapshot / object storage is $0.000072 per GB-hour.
  Active Axons bill at $0.006 per axon-hour. The primary optimization levers are
  suspending or shutting down idle devboxes, tuning keep-alive / idle windows,
  right-sizing CPU and memory, and pruning stale snapshots and objects.
notes: >-
  Rates are as published on the Runloop pricing page at the time of writing and
  are subject to change; verify during reconciliation.
