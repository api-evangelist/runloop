principles:
- name: Visibility
  description: Track running-devbox count and per-devbox uptime; attribute devbox-hours to teams and agent-evaluation runs.
- name: Allocation
  description: Tag devboxes, scenarios and benchmarks per workload/team via metadata; map to internal cost centers.
- name: Optimization
  description: Suspend idle devboxes (suspended devboxes accrue $0 compute), set conservative keep-alive / idle windows, right-size CPU and memory, and prune stale snapshots and objects.
- name: Accountability
  description: Assign owners per project; review devbox-hour and storage spend monthly against budget.
